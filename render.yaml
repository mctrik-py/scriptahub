services:
  - type: web
    name: scriptahub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scriptahub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STATIC_ROOT
        value: /opt/render/project/src/backend/staticfiles
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: scriptahub-db
    plan: free